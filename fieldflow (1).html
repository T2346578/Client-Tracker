<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F0; --card:#FFFFFF; --ink:#152522; --ink-soft:#5B6B65;
    --line:#E2DFD4; --green:#2F6B47; --green-dark:#204E34; --green-soft:#E7F0E9;
    --red:#B3462C; --gold:#B8862E;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181A; --card:#1A2224; --ink:#EDEFEC; --ink-soft:#9FB0AC;
      --line:#2A3436; --green:#5AAE7B; --green-dark:#3D7A57; --green-soft:#1E2E25;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181A; --card:#1A2224; --ink:#EDEFEC; --ink-soft:#9FB0AC;
    --line:#2A3436; --green:#5AAE7B; --green-dark:#3D7A57; --green-soft:#1E2E25;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);}
  #app{display:flex;min-height:100%;}

  /* Sidebar */
  .sidebar{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
    padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;}
  .brand{font-weight:800;font-size:1.15rem;letter-spacing:-0.02em;padding:6px 10px 18px;color:var(--ink);}
  .brand span{color:var(--green);}
  .navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:none;
    background:transparent;color:var(--ink-soft);font-size:0.95rem;font-weight:600;cursor:pointer;text-align:left;width:100%;}
  .navbtn:hover{background:var(--green-soft);color:var(--ink);}
  .navbtn.active{background:var(--green-dark);color:#fff;}
  .navbtn .ic{width:18px;text-align:center;}

  .main{flex:1;min-width:0;padding:28px 32px 90px;max-width:980px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:12px;flex-wrap:wrap;}
  h1{font-size:1.5rem;margin:0;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:0.9rem;margin-top:4px;}

  .btn{background:var(--green);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;
    font-size:0.9rem;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--green-dark);}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--green-soft);}
  .btn.small{padding:6px 11px;font-size:0.82rem;}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--line);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--green-soft);cursor:pointer;}
  .name{font-weight:700;font-size:0.98rem;}
  .meta{color:var(--ink-soft);font-size:0.82rem;margin-top:2px;}
  .paid{font-weight:700;color:var(--green-dark);white-space:nowrap;}

  .empty{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty b{color:var(--ink);display:block;margin-bottom:6px;font-size:1.05rem;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,15,13,0.45);display:none;align-items:flex-start;justify-content:center;
    z-index:50;padding:40px 16px;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--card);border-radius:14px;max-width:460px;width:100%;padding:22px;border:1px solid var(--line);}
  .modal h2{margin:0 0 16px;font-size:1.15rem;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:0.78rem;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-family:inherit;font-size:0.92rem;}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  /* schedule */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .navarrows button{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink);font-size:0.95rem;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:0.72rem;color:var(--ink-soft);text-align:center;font-weight:700;padding-bottom:4px;}
  .cal-cell{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:5px;font-size:0.75rem;background:var(--card);}
  .cal-cell.other{opacity:0.35;}
  .cal-cell.today{border-color:var(--green);}
  .cal-daynum{font-weight:700;margin-bottom:3px;}
  .appt{background:var(--green-soft);color:var(--green-dark);border-radius:5px;padding:2px 5px;margin-bottom:2px;font-size:0.68rem;
    font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* quotes */
  .tabbtn{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    font-size:0.8rem;font-weight:600;cursor:pointer;}
  .tabbtn.active{background:var(--green-dark);color:#fff;border-color:var(--green-dark);}
  .status-pill{font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .status-draft{background:#EDEAE0;color:#6B6650;}
  .status-sent{background:#FBF0DA;color:var(--gold);}
  .status-invoice{background:#E2ECFB;color:#2E5FB8;}
  .status-paid{background:var(--green-soft);color:var(--green-dark);}

  .li-row{display:grid;grid-template-columns:1fr 70px 90px 26px;gap:8px;align-items:center;margin-bottom:8px;}
  .li-row input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:0.85rem;}
  .rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:1.05rem;}
  .totals{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:0.88rem;}
  .totals .trow{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink-soft);}
  .totals .trow.grand{color:var(--ink);font-weight:800;font-size:1.05rem;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;}

  .bottomnav{display:none;}
  @media (max-width: 760px){
    .sidebar{display:none;}
    .main{padding:18px 14px 100px;max-width:100%;}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
      padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:40;}
    .bottomnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
      color:var(--ink-soft);font-size:0.68rem;font-weight:600;cursor:pointer;font-family:inherit;}
    .bottomnav button.active{color:var(--green-dark);}
    .brand-mobile{font-weight:800;font-size:1.2rem;margin-bottom:16px;}
    .brand-mobile span{color:var(--green);}
  }
</style>
</head>
<body>
<div id="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">Field<span>Flow</span></div>
    <button class="navbtn" data-view="clients"><span class="ic">👤</span> Clients</button>
    <button class="navbtn" data-view="schedule"><span class="ic">📅</span> Schedule</button>
    <button class="navbtn" data-view="quotes"><span class="ic">🧾</span> Quotes & Invoices</button>
    <div style="flex:1;"></div>
    <button class="navbtn" data-view="settings"><span class="ic">⚙️</span> Settings</button>
  </nav>
  <main class="main" id="main"></main>
</div>
<nav class="bottomnav" id="bottomnav">
  <button data-view="clients">👤<span>Clients</span></button>
  <button data-view="schedule">📅<span>Schedule</span></button>
  <button data-view="quotes">🧾<span>Quotes</span></button>
  <button data-view="settings">⚙️<span>Settings</span></button>
</nav>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

<script>
// ---------- storage ----------
const DB_KEY = 'fieldflow_data_v1';
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('storage read failed', e); }
  return { clients: [], jobs: [], quotes: [], settings: defaultSettings() };
}
function defaultSettings(){
  return { businessName: '', email: 'lprimeshinel@gmail.com', phone: '647-637-9216' };
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ console.warn('storage write failed', e); }
}
let db = loadDB();
if(!db.settings) db.settings = defaultSettings();
let view = 'clients';
let calMonth = new Date(); calMonth.setDate(1);
let quoteFilter = 'all';

function uid(){ return Math.random().toString(36).slice(2,9); }
function fmt(n){ return '$' + (Number(n)||0).toFixed(2); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- nav ----------
document.querySelectorAll('.navbtn,#bottomnav button').forEach(b=>{
  b.addEventListener('click', ()=>{ view = b.dataset.view; render(); });
});

function setActiveNav(){
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  document.querySelectorAll('#bottomnav button').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
}

function closeModal(){ document.getElementById('overlay').classList.remove('open'); document.getElementById('modalBody').innerHTML=''; }
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('overlay').classList.add('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

// ---------- render router ----------
function render(){
  setActiveNav();
  const main = document.getElementById('main');
  if(view==='clients') main.innerHTML = renderClients();
  else if(view==='schedule') main.innerHTML = renderSchedule();
  else if(view==='settings') main.innerHTML = renderSettings();
  else main.innerHTML = renderQuotes();
  attachHandlers();
}

// ================= CLIENTS =================
function renderClients(){
  const rows = db.clients.map(c=>{
    const paid = db.quotes.filter(q=>q.clientId===c.id && q.status==='paid').reduce((s,q)=>s+quoteTotal(q),0);
    return `<div class="list-row" data-client="${c.id}">
      <div>
        <div class="name">${esc(c.name)}</div>
        <div class="meta">${esc(c.address)||'No address'} · ${esc(c.phone)||'—'} · ${esc(c.email)||'—'}</div>
      </div>
      <div class="paid">${fmt(paid)}</div>
    </div>`;
  }).join('');
  return `
    <div class="topline">
      <div><h1>Clients</h1><div class="sub">${db.clients.length} client${db.clients.length===1?'':'s'}</div></div>
      <button class="btn" id="addClientBtn">+ Add client</button>
    </div>
    <div class="card">${rows || `<div class="empty"><b>No clients yet</b>Add your first client to start scheduling jobs and sending quotes.</div>`}</div>
  `;
}

function clientForm(existing){
  const c = existing || {name:'',address:'',phone:'',email:''};
  return `
    <h2>${existing?'Edit client':'Add client'}</h2>
    <div class="field"><label>Full name</label><input id="f_name" value="${esc(c.name)}" placeholder="Jane Doe"></div>
    <div class="field"><label>Address</label><input id="f_address" value="${esc(c.address)}" placeholder="123 Main St, City"></div>
    <div class="row2">
      <div class="field"><label>Phone</label><input id="f_phone" value="${esc(c.phone)}" placeholder="(555) 555-1234"></div>
      <div class="field"><label>Email</label><input id="f_email" value="${esc(c.email)}" placeholder="jane@email.com"></div>
    </div>
    <div class="modal-actions">
      ${existing?'<button class="btn danger" id="deleteClientBtn">Delete</button>':''}
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveClientBtn">${existing?'Save changes':'Add client'}</button>
    </div>`;
}

function clientDetail(c){
  const cq = db.quotes.filter(q=>q.clientId===c.id);
  const cj = db.jobs.filter(j=>j.clientId===c.id);
  const paid = cq.filter(q=>q.status==='paid').reduce((s,q)=>s+quoteTotal(q),0);
  return `
    <h2>${esc(c.name)}</h2>
    <div class="field"><div class="meta">${esc(c.address)||'No address'}</div>
    <div class="meta">${esc(c.phone)||'No phone'} · ${esc(c.email)||'No email'}</div></div>
    <div class="totals"><div class="trow grand"><span>Total paid</span><span>${fmt(paid)}</span></div></div>
    <div style="margin-top:14px;">
      <div class="meta" style="font-weight:700;margin-bottom:6px;">Jobs (${cj.length})</div>
      ${cj.length ? cj.map(j=>`<div class="meta">${j.date} — ${esc(j.title)}</div>`).join('') : '<div class="meta">No jobs scheduled.</div>'}
    </div>
    <div style="margin-top:12px;">
      <div class="meta" style="font-weight:700;margin-bottom:6px;">Quotes/Invoices (${cq.length})</div>
      ${cq.length ? cq.map(q=>`<div class="meta">#${q.num} · ${fmt(quoteTotal(q))} · ${q.status}</div>`).join('') : '<div class="meta">None yet.</div>'}
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Close</button>
      <button class="btn" id="editClientBtn">Edit</button>
    </div>`;
}

// ================= SCHEDULE =================
function renderSchedule(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrev = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:daysInPrev-i, other:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, other:false, y, m});
  while(cells.length % 7 !== 0 || cells.length < 35) cells.push({d:cells.length, other:true});
  const today = new Date();
  const monthLabel = calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dows = ['S','M','T','W','T','F','S'];

  const cellsHtml = cells.map(c=>{
    const isToday = !c.other && c.y===today.getFullYear() && c.m===today.getMonth() && c.d===today.getDate();
    let apptsHtml = '';
    if(!c.other){
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
      const dayJobs = db.jobs.filter(j=>j.date===dateStr);
      apptsHtml = dayJobs.map(j=>{
        const client = db.clients.find(cl=>cl.id===j.clientId);
        return `<div class="appt" data-job="${j.id}">${esc((client&&client.name)||j.title)}</div>`;
      }).join('');
    }
    return `<div class="cal-cell ${c.other?'other':''} ${isToday?'today':''}" ${!c.other?`data-day="${c.d}"`:''}>
      <div class="cal-daynum">${c.d}</div>${apptsHtml}</div>`;
  }).join('');

  return `
    <div class="topline">
      <div><h1>Schedule</h1><div class="sub">Tap a day to book a job</div></div>
      <button class="btn" id="addJobBtn">+ New job</button>
    </div>
    <div class="card" style="padding:16px;">
      <div class="cal-head">
        <div class="navarrows" style="display:flex;gap:8px;">
          <button id="prevMonth">‹</button><button id="nextMonth">›</button>
        </div>
        <div style="font-weight:700;">${monthLabel}</div>
        <div style="width:60px;"></div>
      </div>
      <div class="cal-grid">
        ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cellsHtml}
      </div>
    </div>
  `;
}

function jobForm(prefillDate){
  const opts = db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  return `
    <h2>New job</h2>
    ${db.clients.length===0?'<div class="meta" style="margin-bottom:10px;">Add a client first.</div>':''}
    <div class="field"><label>Client</label><select id="f_client">${opts}</select></div>
    <div class="field"><label>Job title</label><input id="f_title" placeholder="e.g. Full Detail (Sedan)"></div>
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${prefillDate||''}"></div>
      <div class="field"><label>Time</label><input type="time" id="f_time" value="09:00"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Instructions for the crew"></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveJobBtn" ${db.clients.length===0?'disabled':''}>Book job</button>
    </div>`;
}

function jobDetail(j){
  const client = db.clients.find(c=>c.id===j.clientId);
  return `
    <h2>${esc(j.title)}</h2>
    <div class="meta">${client?esc(client.name):'Unknown client'}</div>
    <div class="meta">${j.date} at ${j.time||'—'}</div>
    ${j.notes?`<div class="field" style="margin-top:10px;">${esc(j.notes)}</div>`:''}
    <div class="modal-actions">
      <button class="btn danger" id="deleteJobBtn">Delete</button>
      <button class="btn ghost" id="cancelBtn">Close</button>
    </div>`;
}

// ================= SETTINGS =================
function renderSettings(){
  const s = db.settings;
  return `
    <div class="topline"><div><h1>Settings</h1><div class="sub">This is what customers see when you email or text a quote</div></div></div>
    <div class="card" style="padding:20px;max-width:420px;">
      <div class="field"><label>Business name</label><input id="s_name" value="${esc(s.businessName)}" placeholder="Your Business Name"></div>
      <div class="field"><label>Sends from this email</label><input id="s_email" value="${esc(s.email)}" placeholder="you@business.com"></div>
      <div class="field"><label>Sends from this phone</label><input id="s_phone" value="${esc(s.phone)}" placeholder="(555) 555-1234"></div>
      <button class="btn" id="saveSettingsBtn" style="margin-top:6px;">Save settings</button>
      <div class="meta" id="settingsSaved" style="margin-top:10px;height:16px;"></div>
    </div>
  `;
}

// ================= QUOTES / INVOICES =================
function quoteTotal(q){ return q.items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0); }

function renderQuotes(){
  const filtered = quoteFilter==='all' ? db.quotes : db.quotes.filter(q=>q.status===quoteFilter);
  const sorted = [...filtered].sort((a,b)=>b.num-a.num);
  const rows = sorted.map(q=>{
    const client = db.clients.find(c=>c.id===q.clientId);
    return `<div class="list-row" data-quote="${q.id}">
      <div>
        <div class="name">#${q.num} — ${client?esc(client.name):'No client'}</div>
        <div class="meta">${q.kind==='invoice'?'Invoice':'Quote'} · ${fmt(quoteTotal(q))}</div>
      </div>
      <span class="status-pill status-${q.status}">${q.status}</span>
    </div>`;
  }).join('');
  const tabs = ['all','draft','sent','invoice','paid'].map(s=>
    `<button class="tabbtn ${quoteFilter===s?'active':''}" data-filter="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('');
  return `
    <div class="topline">
      <div><h1>Quotes & Invoices</h1><div class="sub">${db.quotes.length} total</div></div>
      <button class="btn" id="addQuoteBtn">+ New quote</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">${tabs}</div>
    <div class="card">${rows || `<div class="empty"><b>No quotes yet</b>Create a quote to send pricing to a customer.</div>`}</div>
  `;
}

function quoteFormState(existing){
  return existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(), num: (db.quotes.reduce((m,q)=>Math.max(m,q.num),0)+1),
    clientId: db.clients[0]?db.clients[0].id:'', kind:'quote', status:'draft',
    items:[{desc:'',qty:1,price:0}]
  };
}
let workingQuote = null;

function quoteFormHtml(){
  const q = workingQuote;
  const opts = db.clients.map(c=>`<option value="${c.id}" ${c.id===q.clientId?'selected':''}>${esc(c.name)}</option>`).join('');
  const itemsHtml = q.items.map((it,i)=>`
    <div class="li-row" data-idx="${i}">
      <input class="it-desc" placeholder="Description" value="${esc(it.desc)}">
      <input class="it-qty" type="number" min="0" placeholder="Qty" value="${it.qty}">
      <input class="it-price" type="number" min="0" step="0.01" placeholder="Price" value="${it.price}">
      <button class="rm" data-rm="${i}">✕</button>
    </div>`).join('');
  const total = quoteTotal(q);
  return `
    <h2>${q.num?('#'+q.num+' — '):''}${q.kind==='invoice'?'Invoice':'Quote'}</h2>
    ${db.clients.length===0?'<div class="meta" style="margin-bottom:10px;">Add a client first.</div>':''}
    <div class="field"><label>Client</label><select id="f_qclient">${opts}</select></div>
    <div class="field"><label>Line items</label>
      <div id="itemsWrap">${itemsHtml}</div>
      <button class="btn ghost small" id="addItemBtn">+ Add line item</button>
    </div>
    <div class="totals"><div class="trow grand"><span>Total</span><span id="qTotalDisplay">${fmt(total)}</span></div></div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn ghost" id="saveDraftBtn">Save draft</button>
      <button class="btn" id="sendQuoteBtn" ${db.clients.length===0?'disabled':''}>Save & mark sent</button>
    </div>`;
}

function refreshItemsUI(){
  document.getElementById('itemsWrap').innerHTML = workingQuote.items.map((it,i)=>`
    <div class="li-row" data-idx="${i}">
      <input class="it-desc" placeholder="Description" value="${esc(it.desc)}">
      <input class="it-qty" type="number" min="0" placeholder="Qty" value="${it.qty}">
      <input class="it-price" type="number" min="0" step="0.01" placeholder="Price" value="${it.price}">
      <button class="rm" data-rm="${i}">✕</button>
    </div>`).join('');
  bindItemInputs();
  document.getElementById('qTotalDisplay').textContent = fmt(quoteTotal(workingQuote));
}
function bindItemInputs(){
  document.querySelectorAll('#itemsWrap .li-row').forEach(row=>{
    const idx = +row.dataset.idx;
    row.querySelector('.it-desc').addEventListener('input', e=> workingQuote.items[idx].desc = e.target.value);
    row.querySelector('.it-qty').addEventListener('input', e=>{ workingQuote.items[idx].qty = e.target.value; document.getElementById('qTotalDisplay').textContent = fmt(quoteTotal(workingQuote)); });
    row.querySelector('.it-price').addEventListener('input', e=>{ workingQuote.items[idx].price = e.target.value; document.getElementById('qTotalDisplay').textContent = fmt(quoteTotal(workingQuote)); });
  });
  document.querySelectorAll('#itemsWrap .rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{ workingQuote.items.splice(+btn.dataset.rm,1); if(workingQuote.items.length===0) workingQuote.items.push({desc:'',qty:1,price:0}); refreshItemsUI(); });
  });
}

function buildQuoteMessage(q, client){
  const s = db.settings;
  const kindLabel = q.kind==='invoice' ? 'Invoice' : 'Quote';
  const from = s.businessName || 'us';
  const lines = [
    `Hi ${client?client.name:'there'},`, '',
    `Here's your ${kindLabel.toLowerCase()} #${q.num} from ${from}.`, '',
    ...q.items.map(it=>`- ${it.desc||'Item'} x${it.qty}: ${fmt((Number(it.qty)||0)*(Number(it.price)||0))}`),
    '', `Total: ${fmt(quoteTotal(q))}`, '',
    `Questions? Reach us at ${s.email}${s.phone?(' or '+s.phone):''}.`, '',
    `Thanks,`, from
  ];
  return { subject: `${kindLabel} #${q.num} from ${from}`, body: lines.join('\n') };
}

function quoteDetail(q){
  const client = db.clients.find(c=>c.id===q.clientId);
  const itemsHtml = q.items.map(it=>`<div class="trow"><span>${esc(it.desc)||'Item'} × ${it.qty}</span><span>${fmt((Number(it.qty)||0)*(Number(it.price)||0))}</span></div>`).join('');
  const msg = buildQuoteMessage(q, client);
  const mailHref = client && client.email
    ? `mailto:${encodeURIComponent(client.email)}?subject=${encodeURIComponent(msg.subject)}&body=${encodeURIComponent(msg.body)}`
    : null;
  const smsHref = client && client.phone
    ? `sms:${encodeURIComponent(client.phone)}?body=${encodeURIComponent(msg.subject+' — '+fmt(quoteTotal(q))+'. Details in your email, or call us at '+db.settings.phone+'.')}`
    : null;
  return `
    <h2>#${q.num} for ${client?esc(client.name):'—'}</h2>
    <span class="status-pill status-${q.status}">${q.status}</span>
    <div class="totals" style="margin-top:12px;">${itemsHtml}<div class="trow grand"><span>Total</span><span>${fmt(quoteTotal(q))}</span></div></div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      ${mailHref ? `<a class="btn ghost small" id="emailQuoteBtn" href="${mailHref}">Email quote</a>` : `<span class="meta">Add client email to send by email</span>`}
      ${smsHref ? `<a class="btn ghost small" id="textQuoteBtn" href="${smsHref}">Text quote</a>` : ''}
    </div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn danger" id="deleteQuoteBtn">Delete</button>
      <button class="btn ghost" id="editQuoteBtn">Edit</button>
      ${q.status!=='paid' ? `<button class="btn" id="markPaidBtn">Mark paid</button>` : ''}
      ${q.status==='draft' ? `<button class="btn" id="markSentBtn">Mark sent</button>` : ''}
      ${(q.status==='sent') ? `<button class="btn" id="convertInvoiceBtn">Convert to invoice</button>` : ''}
    </div>`;
}

// ---------- event wiring ----------
function attachHandlers(){
  // Clients view
  const addClientBtn = document.getElementById('addClientBtn');
  if(addClientBtn) addClientBtn.addEventListener('click', ()=> openModal(clientForm(null)));
  document.querySelectorAll('[data-client]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const c = db.clients.find(x=>x.id===row.dataset.client);
      openModal(clientDetail(c));
      bindClientDetailActions(c);
    });
  });
  bindClientFormIfPresent(null);

  // Schedule view
  const addJobBtn = document.getElementById('addJobBtn');
  if(addJobBtn) addJobBtn.addEventListener('click', ()=>{ openModal(jobForm('')); bindJobFormActions(null); });
  const prevM = document.getElementById('prevMonth'), nextM = document.getElementById('nextMonth');
  if(prevM) prevM.addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); render(); });
  if(nextM) nextM.addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); render(); });
  document.querySelectorAll('.cal-cell[data-day]').forEach(cell=>{
    cell.addEventListener('click', (e)=>{
      if(e.target.closest('.appt')) return;
      const y = calMonth.getFullYear(), m = calMonth.getMonth();
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(cell.dataset.day).padStart(2,'0')}`;
      openModal(jobForm(dateStr)); bindJobFormActions(null);
    });
  });
  document.querySelectorAll('.appt').forEach(a=>{
    a.addEventListener('click', (e)=>{
      e.stopPropagation();
      const j = db.jobs.find(x=>x.id===a.dataset.job);
      openModal(jobDetail(j));
      document.getElementById('deleteJobBtn').addEventListener('click', ()=>{ db.jobs = db.jobs.filter(x=>x.id!==j.id); saveDB(); closeModal(); render(); });
      document.getElementById('cancelBtn').addEventListener('click', closeModal);
    });
  });

  // Settings view
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  if(saveSettingsBtn) saveSettingsBtn.addEventListener('click', ()=>{
    db.settings.businessName = document.getElementById('s_name').value.trim();
    db.settings.email = document.getElementById('s_email').value.trim();
    db.settings.phone = document.getElementById('s_phone').value.trim();
    saveDB();
    const msg = document.getElementById('settingsSaved');
    msg.textContent = 'Saved.'; setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000);
  });

  // Quotes view
  const addQuoteBtn = document.getElementById('addQuoteBtn');
  if(addQuoteBtn) addQuoteBtn.addEventListener('click', ()=>{
    workingQuote = quoteFormState(null);
    openModal(quoteFormHtml()); bindQuoteFormActions(false);
  });
  document.querySelectorAll('.tabbtn').forEach(t=> t.addEventListener('click', ()=>{ quoteFilter = t.dataset.filter; render(); }));
  document.querySelectorAll('[data-quote]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const q = db.quotes.find(x=>x.id===row.dataset.quote);
      openModal(quoteDetail(q));
      bindQuoteDetailActions(q);
    });
  });
}

function bindClientFormIfPresent(existing){
  const saveBtn = document.getElementById('saveClientBtn');
  if(!saveBtn) return;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  saveBtn.addEventListener('click', ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name) return;
    const data = {
      name, address: document.getElementById('f_address').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      email: document.getElementById('f_email').value.trim()
    };
    if(existing){ Object.assign(existing, data); }
    else { db.clients.push({ id: uid(), ...data }); }
    saveDB(); closeModal(); render();
  });
  const delBtn = document.getElementById('deleteClientBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    db.clients = db.clients.filter(c=>c.id!==existing.id);
    db.jobs = db.jobs.filter(j=>j.clientId!==existing.id);
    db.quotes = db.quotes.filter(q=>q.clientId!==existing.id);
    saveDB(); closeModal(); render();
  });
}

function bindClientDetailActions(c){
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('editClientBtn').addEventListener('click', ()=>{
    openModal(clientForm(c)); bindClientFormIfPresent(c);
  });
}

function bindJobFormActions(existing){
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  const saveBtn = document.getElementById('saveJobBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const clientId = document.getElementById('f_client').value;
    const title = document.getElementById('f_title').value.trim() || 'Job';
    const date = document.getElementById('f_date').value;
    const time = document.getElementById('f_time').value;
    const notes = document.getElementById('f_notes').value.trim();
    if(!date) return;
    db.jobs.push({ id: uid(), clientId, title, date, time, notes });
    saveDB(); closeModal(); render();
  });
}

function bindQuoteFormActions(){
  bindItemInputs();
  document.getElementById('cancelBtn').addEventListener('click', ()=>{ workingQuote=null; closeModal(); });
  document.getElementById('addItemBtn').addEventListener('click', ()=>{
    workingQuote.items.push({desc:'',qty:1,price:0}); refreshItemsUI();
  });
  document.getElementById('f_qclient').addEventListener('change', e=> workingQuote.clientId = e.target.value);
  function persist(status){
    workingQuote.clientId = document.getElementById('f_qclient').value;
    workingQuote.status = status;
    const idx = db.quotes.findIndex(q=>q.id===workingQuote.id);
    if(idx>=0) db.quotes[idx] = workingQuote; else db.quotes.push(workingQuote);
    saveDB(); workingQuote=null; closeModal(); render();
  }
  document.getElementById('saveDraftBtn').addEventListener('click', ()=> persist('draft'));
  document.getElementById('sendQuoteBtn').addEventListener('click', ()=> persist('sent'));
}

function bindQuoteDetailActions(q){
  document.getElementById('cancelBtn') && document.getElementById('cancelBtn').addEventListener('click', closeModal);
  const emailBtn = document.getElementById('emailQuoteBtn');
  if(emailBtn) emailBtn.addEventListener('click', ()=>{ if(q.status==='draft'){ q.status='sent'; saveDB(); } });
  const textBtn = document.getElementById('textQuoteBtn');
  if(textBtn) textBtn.addEventListener('click', ()=>{ if(q.status==='draft'){ q.status='sent'; saveDB(); } });
  const editBtn = document.getElementById('editQuoteBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{ workingQuote = quoteFormState(q); openModal(quoteFormHtml()); bindQuoteFormActions(); });
  const delBtn = document.getElementById('deleteQuoteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{ db.quotes = db.quotes.filter(x=>x.id!==q.id); saveDB(); closeModal(); render(); });
  const paidBtn = document.getElementById('markPaidBtn');
  if(paidBtn) paidBtn.addEventListener('click', ()=>{ q.status='paid'; saveDB(); closeModal(); render(); });
  const sentBtn = document.getElementById('markSentBtn');
  if(sentBtn) sentBtn.addEventListener('click', ()=>{ q.status='sent'; saveDB(); closeModal(); render(); });
  const convBtn = document.getElementById('convertInvoiceBtn');
  if(convBtn) convBtn.addEventListener('click', ()=>{ q.kind='invoice'; q.status='invoice'; saveDB(); closeModal(); render(); });
}

render();
</script>
</body>
</html>
